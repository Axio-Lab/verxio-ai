server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets are pre-compressed at image build (scripts/precompress.mjs):
    # serve the .gz next to the file instead of compressing per request.
    # Brotli (.br) is served by the CDN / ingress-nginx (enable-brotli) — the
    # stock alpine image has no brotli module, so the origin sticks to gzip.
    gzip_static on;

    # On-the-fly gzip for everything that is not pre-compressed (API JSON).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff2
        application/font-woff
        application/font-woff2;

    # Keep-alive to the API so every poll does not pay a new TCP handshake.
    # (Requires an upstream block; proxy_pass to a bare host cannot reuse.)
    # See `upstream verxio_api` below.

    # Kubernetes probes — never hits disk or the API.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Runtime websocket: long builds can go quiet for many minutes. uvicorn pings
    # every 20s, but keep a wide read timeout so a stalled ping never drops the
    # session in the middle of a run.
    location /api/runtime/dashboard/ws/ {
        proxy_pass http://verxio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        client_max_body_size 64m;
        proxy_pass http://verxio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Legacy relative-base bundles request /share/notepad/assets/* — serve real assets.
    location ~ ^/share/notepad/assets/(.*)$ {
        rewrite ^/share/notepad/assets/(.*)$ /assets/$1 break;
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Same for fonts: CSS under /share/notepad/assets resolves ../fonts → /share/notepad/fonts.
    location ~ ^/share/notepad/fonts/(.*)$ {
        rewrite ^/share/notepad/fonts/(.*)$ /fonts/$1 break;
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Hashed Vite assets — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        # HTML must revalidate so deploys pick up new asset hashes.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Persistent connections to the API: each nginx worker keeps a small pool of
# idle upstream sockets so status polls skip the TCP (and, behind a mesh, TLS)
# handshake. Resolved at start via the cluster/compose DNS name.
upstream verxio_api {
    server verxio-api:8787;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Only upgrade when the client asked for it; plain API calls keep the
# keep-alive connection (Connection "upgrade" on every request defeats it).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
