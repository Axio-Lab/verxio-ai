server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets — critical on low bandwidth / mobile.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff2
        application/font-woff
        application/font-woff2;

    location /api/ {
        client_max_body_size 64m;
        proxy_pass http://verxio-api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Legacy relative-base bundles request /share/notepad/assets/* — serve real assets.
    location ~ ^/share/notepad/assets/(.*)$ {
        rewrite ^/share/notepad/assets/(.*)$ /assets/$1 break;
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Same for fonts: CSS under /share/notepad/assets resolves ../fonts → /share/notepad/fonts.
    location ~ ^/share/notepad/fonts/(.*)$ {
        rewrite ^/share/notepad/fonts/(.*)$ /fonts/$1 break;
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Hashed Vite assets — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        # HTML must revalidate so deploys pick up new asset hashes.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
