# Self-hosted Postiz stack for Verxio Socials.
# Usage: docker compose -f docker-compose.verxio.yml -f docker-compose.postiz.yml up -d
name: verxio-ai

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: verxio-postiz
    restart: unless-stopped
    environment:
      MAIN_URL: ${POSTIZ_PUBLIC_URL:-http://127.0.0.1:4007}
      FRONTEND_URL: ${POSTIZ_PUBLIC_URL:-http://127.0.0.1:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_PUBLIC_URL:-http://127.0.0.1:4007}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-verxio-local-postiz-jwt-change-me}
      DATABASE_URL: postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      NOT_SECURED: ${POSTIZ_NOT_SECURED:-true}
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      API_LIMIT: ${POSTIZ_API_LIMIT:-90}
      NX_ADD_PLUGINS: 'false'
      X_API_KEY: ${POSTIZ_X_API_KEY:-}
      X_API_SECRET: ${POSTIZ_X_API_SECRET:-}
      LINKEDIN_CLIENT_ID: ${POSTIZ_LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${POSTIZ_LINKEDIN_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${POSTIZ_FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${POSTIZ_FACEBOOK_APP_SECRET:-}
      THREADS_APP_ID: ${POSTIZ_THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${POSTIZ_THREADS_APP_SECRET:-}
      YOUTUBE_CLIENT_ID: ${POSTIZ_YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${POSTIZ_YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${POSTIZ_TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${POSTIZ_TIKTOK_CLIENT_SECRET:-}
      REDDIT_CLIENT_ID: ${POSTIZ_REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${POSTIZ_REDDIT_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${POSTIZ_DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${POSTIZ_DISCORD_CLIENT_SECRET:-}
      SLACK_ID: ${POSTIZ_SLACK_ID:-}
      SLACK_SECRET: ${POSTIZ_SLACK_SECRET:-}
      SLACK_SIGNING_SECRET: ${POSTIZ_SLACK_SIGNING_SECRET:-}
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - '127.0.0.1:4007:5000'
    networks:
      - default
      - postiz-temporal
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  postiz-postgres:
    image: postgres:17-alpine
    container_name: verxio-postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postiz-postgres-data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz-user -d postiz-db-local']
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2
    container_name: verxio-postiz-redis
    restart: unless-stopped
    volumes:
      - postiz-redis-data:/data
    networks:
      - default
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  temporal-postgresql:
    image: postgres:16-alpine
    container_name: verxio-postiz-temporal-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    volumes:
      - postiz-temporal-pg-data:/var/lib/postgresql/data
    networks:
      - postiz-temporal

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: verxio-postiz-temporal-es
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - postiz-temporal

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: verxio-postiz-temporal
    restart: unless-stopped
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - ./var/postiz/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - postiz-temporal

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres-data:
  postiz-redis-data:
  postiz-temporal-pg-data:

networks:
  postiz-temporal:
    driver: bridge
