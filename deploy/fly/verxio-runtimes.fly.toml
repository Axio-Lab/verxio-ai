# Fly app that hosts per-tenant Hermes Machines (created by FlyRuntimeManager).
# Create with: fly apps create verxio-runtimes
# Token: fly tokens create deploy -a verxio-runtimes  -> VERXIO_FLY_API_TOKEN

app = 'verxio-runtimes'
primary_region = 'iad'

[build]
  dockerfile = 'hermes-agent/Dockerfile'

[env]
  HERMES_DASHBOARD = '1'
  HERMES_DASHBOARD_HOST = '0.0.0.0'
  HERMES_DASHBOARD_PORT = '9119'
  HERMES_DASHBOARD_INSECURE = '1'

# Machines are created/destroyed by verxio-api FlyRuntimeManager — this file
# documents the app + image build only.
