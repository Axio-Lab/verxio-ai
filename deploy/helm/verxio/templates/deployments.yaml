apiVersion: v1
kind: Service
metadata:
  name: verxio-api
spec:
  ports:
    - port: 8787
      targetPort: 8787
  selector:
    app: verxio-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verxio-api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app: verxio-api
  template:
    metadata:
      labels:
        app: verxio-api
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api }}
          ports:
            - containerPort: 8787
          env:
            - name: VERXIO_RUNTIME_MANAGER
              value: {{ .Values.env.VERXIO_RUNTIME_MANAGER | quote }}
            - name: VERXIO_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: VERXIO_AUTO_MIGRATE
              value: {{ .Values.env.VERXIO_AUTO_MIGRATE | quote }}
            - name: VERXIO_INLINE_SCHEDULER
              value: {{ .Values.env.VERXIO_INLINE_SCHEDULER | quote }}
            - name: VERXIO_WEBHOOK_INLINE
              value: {{ .Values.env.VERXIO_WEBHOOK_INLINE | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8787
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verxio-scheduler
spec:
  replicas: {{ .Values.replicaCount.scheduler }}
  selector:
    matchLabels:
      app: verxio-scheduler
  template:
    metadata:
      labels:
        app: verxio-scheduler
    spec:
      containers:
        - name: scheduler
          image: {{ .Values.images.api }}
          command: ["python", "-m", "app.scheduler"]
          env:
            - name: VERXIO_REDIS_URL
              value: {{ .Values.redis.url | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verxio-agent-worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app: verxio-agent-worker
  template:
    metadata:
      labels:
        app: verxio-agent-worker
    spec:
      containers:
        - name: worker
          image: {{ .Values.images.api }}
          command: ["python", "-m", "app.worker.runner"]
          env:
            - name: VERXIO_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: VERXIO_LOCAL_HERMES_URL
              value: "http://127.0.0.1:9119"
            - name: VERXIO_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verxio-internal
                  key: token
                  optional: true
        - name: hermes
          image: {{ .Values.images.hermes }}
          env:
            - name: VERXIO_HOSTED
              value: "1"
            - name: DOCKER_HOST
              value: {{ .Values.sandbox.dockerHost | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verxio-channel-gateway
spec:
  replicas: {{ .Values.replicaCount.channelGateway }}
  selector:
    matchLabels:
      app: verxio-channel-gateway
  template:
    metadata:
      labels:
        app: verxio-channel-gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.images.hermes }}
          args: ["gateway", "run"]
          env:
            - name: VERXIO_REMOTE_EXEC
              value: "1"
            - name: VERXIO_HOSTED
              value: "1"
            - name: VERXIO_REDIS_URL
              value: {{ .Values.redis.url | quote }}
---
{{- if .Values.autoscaling.worker.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: verxio-agent-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: verxio-agent-worker
  minReplicas: {{ .Values.autoscaling.worker.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.worker.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
