name: verxio-ai

services:
  verxio-api:
    build:
      context: .
      dockerfile: verxio-api/Dockerfile
    image: verxio-api:local
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      VERXIO_DATABASE_MODE: ${VERXIO_DATABASE_MODE:-turso}
      VERXIO_DATABASE_PATH: /app/.verxio/verxio-control.sqlite3
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      VERXIO_RUNTIME_MANAGER: ${VERXIO_RUNTIME_MANAGER:-local-docker}
      VERXIO_RUNTIME_RESTART_POLICY: ${VERXIO_RUNTIME_RESTART_POLICY:-no}
      VERXIO_RUNTIME_PUBLISH_PORTS: ${VERXIO_RUNTIME_PUBLISH_PORTS:-true}
      VERXIO_RUNTIME_IDLE_ENABLED: ${VERXIO_RUNTIME_IDLE_ENABLED:-true}
      VERXIO_RUNTIME_IDLE_POLICY: ${VERXIO_RUNTIME_IDLE_POLICY:-default}
      VERXIO_IDLE_REAPER_ENABLED: ${VERXIO_IDLE_REAPER_ENABLED:-true}
      VERXIO_IDLE_REAPER_INTERVAL_SECONDS: ${VERXIO_IDLE_REAPER_INTERVAL_SECONDS:-60}
      VERXIO_REDIS_URL: ${VERXIO_REDIS_URL:-}
      VERXIO_ARTIFACT_STORE: ${VERXIO_ARTIFACT_STORE:-local}
      VERXIO_RUNTIME_READY_TIMEOUT_SECONDS: ${VERXIO_RUNTIME_READY_TIMEOUT_SECONDS:-180}
      VERXIO_K8S_ENABLED: ${VERXIO_K8S_ENABLED:-false}
      VERXIO_K8S_NAMESPACE: ${VERXIO_K8S_NAMESPACE:-verxio-runtimes}
      VERXIO_K8S_CONNECT_MODE: ${VERXIO_K8S_CONNECT_MODE:-hostPort}
      VERXIO_K8S_NODE_HOST: ${VERXIO_K8S_NODE_HOST:-verxio-control-plane}
      VERXIO_K8S_HOST_PATH_ROOT: ${VERXIO_K8S_HOST_PATH_ROOT:-/verxio-runtimes}
      KUBECONFIG: ${KUBECONFIG_IN_CONTAINER:-/kube/config}
      VERXIO_AUTOSTART_HERMES: 'false'
      VERXIO_RUNTIME_ROOT: /app/.verxio/runtimes
      VERXIO_RUNTIME_DOCKER_ROOT: ${VERXIO_RUNTIME_DOCKER_ROOT:-${VERXIO_STATE_DIR:-${PWD}/.verxio}/runtimes}
      VERXIO_HERMES_IMAGE: ${VERXIO_HERMES_IMAGE:-verxio-hermes-runtime:local}
      VERXIO_RUNTIME_CONNECT_HOST: ${VERXIO_RUNTIME_CONNECT_HOST:-host.docker.internal}
      VERXIO_RUNTIME_PUBLISH_HOST: ${VERXIO_RUNTIME_PUBLISH_HOST:-127.0.0.1}
      # Shared with Hermes runtimes so API can reach them by container DNS (HTTP+WS).
      # On ECS set explicitly: VERXIO_RUNTIME_DOCKER_NETWORK=verxio-ai_default
      VERXIO_RUNTIME_DOCKER_NETWORK: ${VERXIO_RUNTIME_DOCKER_NETWORK:-verxio-ai_default}
      VERXIO_RUNTIME_UID: ${HERMES_UID:-10000}
      VERXIO_RUNTIME_GID: ${HERMES_GID:-10000}
      VERXIO_DASHBOARD_PORT_START: ${VERXIO_DASHBOARD_PORT_START:-19119}
      VERXIO_PUBLIC_WEB_URL: ${VERXIO_PUBLIC_WEB_URL:-http://127.0.0.1:8080}
      VERXIO_COOKIE_SECURE: ${VERXIO_COOKIE_SECURE:-false}
      VERXIO_CORS_ORIGINS: ${VERXIO_CORS_ORIGINS:-}
      VERXIO_SESSION_DAYS: ${VERXIO_SESSION_DAYS:-7}
      VERXIO_AUTH_CODE_SECRET: ${VERXIO_AUTH_CODE_SECRET:-}
      VERXIO_AUTH_CODE_TTL_MINUTES: ${VERXIO_AUTH_CODE_TTL_MINUTES:-10}
      VERXIO_AUTH_CODE_MAX_ATTEMPTS: ${VERXIO_AUTH_CODE_MAX_ATTEMPTS:-5}
      VERXIO_SMTP_HOST: ${VERXIO_SMTP_HOST:-}
      VERXIO_SMTP_PORT: ${VERXIO_SMTP_PORT:-587}
      VERXIO_SMTP_USERNAME: ${VERXIO_SMTP_USERNAME:-}
      VERXIO_SMTP_PASSWORD: ${VERXIO_SMTP_PASSWORD:-}
      VERXIO_SMTP_FROM: ${VERXIO_SMTP_FROM:-}
      VERXIO_SMTP_TLS: ${VERXIO_SMTP_TLS:-true}
      VERXIO_HOSTED_QWEN_API_KEY: ${VERXIO_HOSTED_QWEN_API_KEY:-${VERXIO_DASHSCOPE_API_KEY:-}}
      VERXIO_HOSTED_QWEN_MODEL: ${VERXIO_HOSTED_QWEN_MODEL:-qwen3.6-plus}
      VERXIO_HOSTED_GEMINI_API_KEY: ${VERXIO_HOSTED_GEMINI_API_KEY:-${VERXIO_GOOGLE_API_KEY:-}}
      VERXIO_HOSTED_GEMINI_MODEL: ${VERXIO_HOSTED_GEMINI_MODEL:-gemini-flash-lite-latest}
      VERXIO_DEFAULT_MONTHLY_CREDIT_USD: ${VERXIO_DEFAULT_MONTHLY_CREDIT_USD:-0}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_API_BASE_URL: ${COMPOSIO_API_BASE_URL:-https://backend.composio.dev/api/v3}
      COMPOSIO_TOOLS_API_BASE_URL: ${COMPOSIO_TOOLS_API_BASE_URL:-https://backend.composio.dev/api/v3.1}
      VERXIO_HERMES_REPO: /opt/hermes-agent
    volumes:
      - ${VERXIO_STATE_DIR:-./.verxio}:/app/.verxio
      - ./hermes-agent:/opt/hermes-agent:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Desktop-synced workspaces live under the host home (e.g. Documents).
      # Without this bind, the API container cannot index generated images there.
      - ${VERXIO_HOST_HOME_BIND:-${HOME}}:${VERXIO_HOST_HOME_BIND:-${HOME}}
      # kind/K8s kubeconfig — only used with docker-compose.kind.yml overlay
      - ${VERXIO_KUBECONFIG_HOST:-./.verxio/kubeconfig-kind}:/kube/config:ro

  verxio-web:
    build:
      context: ./verxio-web
      args:
        VITE_VERXIO_API_ENABLED: 'true'
        VITE_VERXIO_API_URL: ''
    image: verxio-web:local
    depends_on:
      - verxio-api
    ports:
      - '127.0.0.1:8080:80'

  # Marketing site for verxio.xyz / www — auth + dashboard stay on app.verxio.xyz (verxio-web).
  verxio-landing:
    build:
      context: ./verxio-landing
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.verxio.xyz}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.verxio.xyz}
    image: verxio-landing:local
    ports:
      - '127.0.0.1:8081:80'

  hermes-runtime-image:
    build:
      context: ./hermes-agent
    image: ${VERXIO_HERMES_IMAGE:-verxio-hermes-runtime:local}
    profiles:
      - image
    command: ['true']
