name: CI

on:
  push:
    branches: [main, master, verxio/web, verxio/architecture, verxio/scale]
  pull_request:
    branches: [main, master, verxio/web, verxio/architecture, verxio/scale]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Format code
        run: npm run fmt

      - name: Run CI checks
        run: npm run format:check && npm run ci:web

  api-orchestration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verxio-api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync verxio-api (dev)
        run: uv sync --extra dev

      - name: Runtime orchestration tests
        run: uv run pytest tests/runtime_orch tests/test_micromgr_agent.py -v
        env:
          VERXIO_DATABASE_MODE: sqlite
          VERXIO_DATABASE_PATH: /tmp/verxio-orch-ci.sqlite3

  hermes-fish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-agent
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Hermes (dev)
        run: uv sync --extra dev

      - name: Fish Audio plugin tests
        run: ./scripts/run_tests.sh tests/plugins/tts/test_fishaudio_provider.py tests/plugins/tts/test_fishaudio_tools.py tests/plugins/tts/test_fishaudio_transcription.py tests/plugins/tts/test_fishaudio_stream.py tests/plugins/tts/test_fishaudio_usage.py tests/plugins/tts/test_fishaudio_audit.py tests/plugins/tts/test_fishaudio_common_security.py tests/plugins/tts/test_fishaudio_gc.py

      - name: Verxio workflow hook tests
        run: ./scripts/run_tests.sh tests/gateway/test_verxio_workflow_hook.py tests/agent/test_oneshot.py

      - name: Verxio tenant isolation
        run: ./scripts/run_tests.sh tests/verxio/test_tenant_isolation.py

  platform-scale:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verxio-api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync verxio-api (dev)
        run: uv sync --extra dev
      - name: Platform scale tests
        run: uv run pytest tests/test_platform_scale.py -q
        env:
          VERXIO_DATABASE_MODE: sqlite
          VERXIO_DATABASE_PATH: /tmp/verxio-scale.sqlite3

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0
      - name: Lint chart
        run: helm lint deploy/helm/verxio -f deploy/helm/verxio/values-staging.yaml
      - name: Render (CPU HPA)
        run: |
          helm template verxio deploy/helm/verxio > /tmp/hpa.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/hpa.yaml
      - name: Render (KEDA + ingress, staging overlay)
        run: |
          helm template verxio deploy/helm/verxio -f deploy/helm/verxio/values-staging.yaml > /tmp/keda.yaml
          grep -q "kind: ScaledObject" /tmp/keda.yaml
          grep -q "kind: Ingress" /tmp/keda.yaml
          grep -q "kind: StatefulSet" /tmp/keda.yaml
          ! grep -q "kind: HorizontalPodAutoscaler" /tmp/keda.yaml
